plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'ir.amir.triedgame'
    compileSdk 34

    defaultConfig {
        applicationId "ir.amir.triedgame"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }

        // Cafe Bazaar in-app billing public key (Poolakey local signature verification)
        buildConfigField "String", "BAZAAR_PUBLIC_KEY", "\"MIHNMA0GCSqGSIb3DQEBAQUAA4G7ADCBtwKBrwCz7j1FqPqnelcGP3STNTGD+OJQLGs3EmTKQg8cVXDDaaT1+1WXZeeDJ9fCaibe6FhmoaPxvo2QXcnVhsgGSdYexUi5btKXldoqiNCIkQ8YmtLO6IUMJ8hZ8BQ2Zmca3ANX9ng6/fJ3OXnb+2ECzJT7s/IMcGOxMviprV5CJtaT5KqpCcmxZbAl1CkLQiLw/QAwna4DU7zP6asVpI1dzFasnQtvM32lwcSH4VCYpw0CAwEAAQ==\""

        // Adivery ad platform
        buildConfigField "String", "ADIVERY_APP_ID", "\"d30a0494-3b55-4554-b530-78af7e7a94d9\""
        buildConfigField "String", "ADIVERY_REWARDED_PLACEMENT_ID", "\"ee5add8b-ea31-4791-8214-08c93a10d976\""
    }

    signingConfigs {
        // NOTE: for a Play/Bazaar-ready release build, replace this with your own
        // keystore before publishing. Debug signing is used here so the project
        // builds out of the box in Android Studio.
        debug {}
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("RELEASE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Cafe Bazaar in-app billing (Poolakey) -- consumable wallet top-up packages.
    // Official Cafe Bazaar library; upstream hardcodes Bazaar's package/service/
    // signing-cert identity internally, so no manifestPlaceholders are needed here.
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'

    // Adivery ads SDK (rewarded video)
    implementation 'com.adivery:sdk:4.9.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
